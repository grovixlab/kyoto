<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyoto Console - OBS Widget Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="portal-layout">
    <header class="top-nav">
        <div class="nav-left">
            <div class="logo">Kyoto<span>OBS</span></div>
        </div>
    </header>

    <div class="main-body">
        <main class="content-area">
            <div class="config-panel">
                <div class="panel-left">
                    <div class="card">
                        <div class="card-header">Parameters Configuration</div>
                        <div class="card-body">
                            <form class="dense-form">
                                <div class="form-item">
                                    <label for="theme">Theme Style</label>
                                    <select id="theme">
                                        <option value="glass">Glassmorphism</option>
                                        <option value="neon">Cyberpunk (Neon)</option>
                                        <option value="minimal">Minimal White</option>
                                        <option value="custom">Custom Solid Color</option>
                                    </select>
                                </div>
                                <div class="form-item">
                                    <label for="font">Font Family</label>
                                    <select id="font">
                                        <option value="Inter">Inter (Default)</option>
                                        <option value="Outfit">Outfit</option>
                                        <option value="Roboto Mono">Roboto Mono</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <div class="form-item">
                                        <label for="color">Text Color</label>
                                        <input type="color" id="color" value="#ffffff">
                                    </div>
                                    <div class="form-item">
                                        <label for="accent">Accent Color</label>
                                        <input type="color" id="accent" value="#00ffcc">
                                    </div>
                                </div>
                                <div class="form-item">
                                    <label for="bg">Background Color (Custom Theme)</label>
                                    <input type="text" id="bg" value="rgba(15, 15, 20, 0.4)">
                                </div>
                                <div class="form-item">
                                    <label>Border Radius (<span id="borderRadius-val">24px</span>)</label>
                                    <input type="range" id="borderRadius" min="0" max="100" value="24">
                                </div>
                                <div class="form-item">
                                    <label>Scale (<span id="scale-val">1.0x</span>)</label>
                                    <input type="range" id="scale" min="0.5" max="3" step="0.1" value="1">
                                </div>

                                <div class="divider"></div>
                                
                                <div class="form-item">
                                    <label>Text Effects</label>
                                    <div class="checkbox-grid">
                                        <label><input type="checkbox" id="textShadow" checked> Text Shadow</label>
                                        <label><input type="checkbox" id="textBorder"> Text Border</label>
                                    </div>
                                </div>
                                <div class="form-row" id="border-settings" style="display: none;">
                                    <div class="form-item">
                                        <label>Border Size (<span id="textBorderSize-val">1px</span>)</label>
                                        <input type="range" id="textBorderSize" min="1" max="10" value="1">
                                    </div>
                                    <div class="form-item">
                                        <label for="textBorderColor">Border Color</label>
                                        <input type="color" id="textBorderColor" value="#000000">
                                    </div>
                                </div>
                                
                                <div class="divider"></div>

                                <div class="form-item">
                                    <label for="format">Time Format</label>
                                    <select id="format">
                                        <option value="12">12-Hour</option>
                                        <option value="24">24-Hour</option>
                                    </select>
                                </div>
                                <div class="form-item">
                                    <label for="animation">Animation</label>
                                    <select id="animation">
                                        <option value="none">None (Best Performance)</option>
                                        <option value="flip">3D Flip</option>
                                        <option value="slide">Smooth Slide</option>
                                    </select>
                                </div>
                                <div class="form-item">
                                    <label>Module Display Control</label>
                                    <div class="checkbox-grid">
                                        <label><input type="checkbox" id="showHours" checked> Hours</label>
                                        <label><input type="checkbox" id="showMinutes" checked> Minutes</label>
                                        <label><input type="checkbox" id="showSeconds" checked> Seconds</label>
                                        <label><input type="checkbox" id="showAmPm" checked> AM/PM</label>
                                        <label><input type="checkbox" id="showDate" checked> Date</label>
                                    </div>
                                </div>
                                
                                <div class="divider"></div>

                                <div class="form-item">
                                    <label>Custom CSS Injection</label>
                                    <p class="help-text">Click or drag elements below to insert them.</p>
                                    <div class="css-chips" id="css-chips">
                                        <span class="chip" draggable="true" data-selector="#clock-container" title="The main wrapper containing the entire overlay">#clock-container (Main Wrapper)</span>
                                        <span class="chip" draggable="true" data-selector=".time-display" title="The wrapper around the time digits">.time-display (Time Wrapper)</span>
                                        <span class="chip" draggable="true" data-selector="#hours" title="The hours text">#hours (Hours)</span>
                                        <span class="chip" draggable="true" data-selector="#minutes" title="The minutes text">#minutes (Minutes)</span>
                                        <span class="chip" draggable="true" data-selector="#seconds" title="The seconds text">#seconds (Seconds)</span>
                                        <span class="chip" draggable="true" data-selector=".ampm" title="The AM/PM indicator">.ampm (AM/PM)</span>
                                        <span class="chip" draggable="true" data-selector=".separator" title="The colon separators">.separator (Colons)</span>
                                        <span class="chip" draggable="true" data-selector=".date-display" title="The wrapper around the date">.date-display (Date Wrapper)</span>
                                    </div>
                                    <textarea id="customCss" class="css-textarea" placeholder="/* Write your custom CSS here... */" rows="6"></textarea>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <div class="action-bar">
                        <input type="text" id="generated-url" readonly class="url-input">
                        <button id="copy-btn" class="btn-primary">Generate & Copy URL</button>
                        <div class="config-actions">
                            <button id="export-btn" class="btn-secondary">Export Config (.txt)</button>
                            <button id="import-btn" class="btn-secondary">Import Config</button>
                            <input type="file" id="import-file" accept=".txt" style="display: none;">
                        </div>
                    </div>
                </div>

                <div class="panel-right">
                    <div class="card preview-card">
                        <div class="card-header">Live Preview <span class="refresh-tip">Auto Sync</span></div>
                        <div class="card-body iframe-container">
                            <iframe id="preview-frame" src="clock.html"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
